<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Dashboard</title>
    <script type="module" src="/build/ir-webcmp.esm.js"></script>
    <script nomodule src="/build/ir-webcmp.js"></script>
    <script src="/scripts/index.js"></script>
    <style>
      body {
        overflow-x: hidden;
      }
    </style>
  </head>

  <body>
    <ir-common></ir-common>
    <ir-dashboard baseurl="https://gateway.igloorooms.com/IR" language="en"></ir-dashboard>

    <script>
      const dashboard_el = document.querySelector('ir-dashboard');
      if (dashboard_el) {
        (async () => {
          dashboard_el.propertyid = getId();
          dashboard_el.ticket = await getToken();
        })();
      }
    </script>
  </body>
</html>
