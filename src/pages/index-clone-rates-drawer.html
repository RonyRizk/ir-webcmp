<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Clone rates drawer</title>
    <script type="module" src="/build/ir-webcmp.esm.js"></script>
    <script nomodule src="/build/ir-webcmp.js"></script>
    <script src="/scripts/index.js"></script>
  </head>

  <body>
    <ir-common></ir-common>
    <ir-interceptor></ir-interceptor>
    <ir-toast></ir-toast>
    <ir-custom-button id="open-clone-rates" variant="brand" size="m">Copy rates to future dates</ir-custom-button>
    <ir-clone-rates-drawer language="en"></ir-clone-rates-drawer>
    <script>
      const drawerEl = document.querySelector('ir-clone-rates-drawer');
      document.querySelector('#open-clone-rates').addEventListener('clickHandler', () => (drawerEl.open = true));
      drawerEl.addEventListener('cloneRatesDrawerClosed', () => (drawerEl.open = false));
      (async () => {
        drawerEl.propertyid = getId();
        drawerEl.ticket = await getToken();
      })();
    </script>
  </body>
</html>
