<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Clone rates</title>
    <script type="module" src="/build/ir-webcmp.esm.js"></script>
    <script nomodule src="/build/ir-webcmp.js"></script>
    <script src="/scripts/index.js"></script>
  </head>

  <body>
    <ir-common></ir-common>
    <ir-clone-rates baseurl="https://gateway.igloorooms.com/IR" language="en"></ir-clone-rates>
    <script>
      const cloneRatesEl = document.querySelector('ir-clone-rates');
      if (cloneRatesEl) {
        (async () => {
          cloneRatesEl.propertyid = getId();
          cloneRatesEl.ticket = await getToken();
        })();
      }
    </script>
  </body>
</html>
