<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Extra Services</title>
    <script type="module" src="/build/ir-webcmp.esm.js"></script>
    <script nomodule src="/build/ir-webcmp.js"></script>
    <script src="/scripts/index.js"></script>
    <style>
        body {
            overflow-x: hidden;
        }
    </style>
</head>

<body>
    <ir-common></ir-common>
    <ir-extra-services-settings baseurl="https://gateway.igloorooms.com/IR" language="en"></ir-extra-services-settings>
    <link rel="stylesheet" href="/assets/scripts/toastr/toastr.css" type="text/css">

    <script>
        const extraServicesEl = document.querySelector("ir-extra-services-settings");
        if (extraServicesEl) {
            (async () => {
                extraServicesEl.propertyid = getId();
                extraServicesEl.ticket = await getToken()
            })();
        }
    </script>

</body>

</html>
