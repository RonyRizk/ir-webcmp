<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Financial Actions</title>
    <script type="module" src="/build/ir-webcmp.esm.js"></script>
    <script nomodule src="/build/ir-webcmp.js"></script>

    <script src="scripts/index.js"></script>
    <style>
        body {
            overflow-x: hidden;
        }
    </style>
</head>

<body>
    <ir-common></ir-common>
    <ir-financial-actions propertyid="42" language="en"
        baseurl="https://gateway.igloorooms.com/IR"></ir-financial-actions>
    <link rel="stylesheet" href="assets/scripts/toastr/toastr.css" type="text/css">

    <script>
        const financialActions = document.querySelector("ir-financial-actions");
        setTimeout(async () => {
            const ticket = await getToken();
            financialActions.propertyid = getId();
            financialActions.ticket = ticket;
        }, 300)
    </script>

</body>
