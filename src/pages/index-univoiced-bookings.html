<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Univoiced Booking</title>
    <script type="module" src="/build/ir-webcmp.esm.js"></script>
    <script nomodule src="/build/ir-webcmp.js"></script>
    <script src="scripts/index.js"></script>

<body>
    <ir-common></ir-common>
    <ir-uninvoiced-bookings language="en" baseurl="https://gateway.igloorooms.com/IR"></ir-uninvoiced-bookings>


    <script>
        const uninvoicedBookingsEl = document.querySelector("ir-uninvoiced-bookings");
        (async () => {
            const ticket = await getToken();
            uninvoicedBookingsEl.propertyid = getId();
            uninvoicedBookingsEl.ticket = ticket;
        })()
    </script>

</body>
