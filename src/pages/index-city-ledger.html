<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>City Ledger</title>
    <script type="module" src="/build/ir-webcmp.esm.js"></script>
    <script nomodule src="/build/ir-webcmp.js"></script>
    <script src="scripts/index.js"></script>
    <style>
        body {
            overflow-x: hidden;
        }
    </style>
</head>

<body>
    <ir-common></ir-common>
    <ir-city-ledger baseurl="https://gateway.igloorooms.com/IR" language="en"></ir-city-ledger>
    <script>
        const cityLedgerEl = document.querySelector("ir-city-ledger");
        if (cityLedgerEl) {
            (async () => {
                cityLedgerEl.propertyid = getId();
                cityLedgerEl.agentId = 227;
                cityLedgerEl.ticket = await getToken()
            })();
        } 
    </script>

</body>

</html>
